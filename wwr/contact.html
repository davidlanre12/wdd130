<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Us | White Water Rafting</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/contact.css">
</head>

<body>

    <header class="site-header">
        <div class="logo">
            <img src="image/logo.jpeg" alt="White Water Rafting Company Logo">
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <!-- Company Info -->
        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>

        <!-- Contact Section -->
        <section class="contact-section">

            <div class="map">
                <img src="image/google map.png" alt="Company Location Map">
            </div>

            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Placeholder">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Placeholder">
                </div>

                <fieldset>
                    <legend>Message Purpose</legend>
                    <label><input type="radio" name="purpose"> General Inquiry</label>
                    <label><input type="radio" name="purpose"> Reservation Question</label>
                    <label><input type="radio" name="purpose"> Website Suggestion</label>
                </fieldset>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="4" placeholder="Type here"></textarea>
                </div>

                <label class="checkbox">
                    <input type="checkbox">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>

        </section>

        <!-- Employees -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">
                <figure class="employee">
                    <img src="image/adventure5.jpg" alt="Employee profile photo">
                    <figcaption>River Guide</figcaption>
                </figure>

                <figure class="employee">
                    <img src="image/adventure2.jpg" alt="Employee profile photo">
                    <figcaption>Trip Coordinator</figcaption>
                </figure>

                <figure class="employee">
                    <img src="image/adventure4.jpg" alt="Employee profile photo">
                    <figcaption>Safety Specialist</figcaption>
                </figure>
            </div>
        </section>


    </main>

    <footer>
        <p>© 2026 White Water Rafting Co. | Olanrewaju David Iyanuoluwa</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="image/facebook.jpg" alt="Facebook Icon">
            </a>
            <a href="https://instagram.com">
                <img src="image/instagram.jpg" alt="Instagram Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="image/linkedin.jpg" alt="LinkedIn Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
