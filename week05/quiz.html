<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Basic HTML and CSS quiz form">
    <meta name="author" content="Olanrewaju David Iyanuoluwa">
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>Basic HTML and CSS Quiz</h1>

        <form>
            <!-- Question 1 -->
            <label for="q1">
                1. What does the acronym CSS stand for?
            </label>
            <input type="text" id="q1" name="q1" required>

            <!-- Question 2 -->
            <label for="q2">
                2. How are id and class attributes selected in CSS?
            </label>
            <textarea id="q2" name="q2" rows="4" required></textarea>

            <!-- Question 3 -->
            <label for="q3">
                3. Which of the following is a valid CSS comment?
            </label>
            <select id="q3" name="q3" required>
                <option value="" selected disabled>Choose One ...</option>
                <option value="html-comment">&lt;!-- comment --&gt;</option>
                <option value="css-comment">/* comment */</option>
                <option value="js-comment">// comment</option>
            </select>

            <!-- Question 4 -->
            <label for="q4">
                4. What is the bottom margin given this declaration?
            </label>

            <div class="code-box">
                margin: 10px 5px 15px;
            </div>

            <input type="number" id="q4" name="q4" required>

            <!-- Submit -->
            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>

</html>
